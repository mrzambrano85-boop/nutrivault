kind = "web"
previewPath = "/"
title = "NutriVault"
version = "1.0.0"
id = "artifacts/nutrivault"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20715

[services.development]
run = "pnpm --filter @workspace/nutrivault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nutrivault", "run", "build" ]
publicDir = "artifacts/nutrivault/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20715"
BASE_PATH = "/"
